[project]
name = "codepilot"
version = "0.1.0"
description = "codePilot - 本地原生桌面 AI 编码助手（对标 Claude Code）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # --- P0: 应用底座 ---
    "pyside6>=6.6",
    "qasync>=0.27",
    "structlog>=24.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # --- P1: 持久化（SQLite）---
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # --- P1: Agent 引擎（框架仅用于 infrastructure/agent）---
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
codepilot = "codepilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# 开发依赖：uv sync 时默认安装
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pyinstaller>=6.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

# ---------------------------------------------------------------------------
# Ruff（lint）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # 行长交给 black 处理
    "RUF001",  # 中文全角标点是有意使用，非歧义
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # 测试里允许 assert（如启用 flake8-bandit 时）
# Qt 信号/事件处理器按 Qt 惯例使用 camelCase，与 Python 命名风格冲突，豁免
"src/codepilot/ui/**" = ["N815", "N802"]

# ---------------------------------------------------------------------------
# Black（格式化）
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy（类型）——起步宽松，核心域可逐步收紧
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
# 核心域按更严标准（占位，后续可加 disallow_untyped_defs 等）
module = ["codepilot.domain.*", "codepilot.application.*"]
check_untyped_defs = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = "-q"
